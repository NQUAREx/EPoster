<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPoster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>
  <aside id="deployUpdateBadge" class="deploy-update-badge" aria-live="polite" hidden>
    <span class="deploy-update-icon" aria-hidden="true">⟳</span>
    <span>Идёт обновление…</span>
  </aside>
  <main id="stateView" class="fullscreen"></main>
  <script>
    (() => {
      const deployUpdateBadge = document.getElementById('deployUpdateBadge');
      const setDeployUpdateBadgeVisible = (visible) => {
        if (!deployUpdateBadge) return;
        if (visible) {
          deployUpdateBadge.removeAttribute('hidden');
          return;
        }
        deployUpdateBadge.setAttribute('hidden', '');
      };

      setDeployUpdateBadgeVisible(false);
      window.setDeployUpdateBadgeVisible = setDeployUpdateBadgeVisible;
    })();
  </script>
  <script src="/ui/app.js"></script>
</body>
</html>
