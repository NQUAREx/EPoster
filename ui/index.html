<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPoster</title>
  <link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>

  <script src="/ui/app.js"></script>
