<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPoster - Dynamic Lava Base (v2)</title>
  <style>
    :root {
      --bg-color: #1a0505; 
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background-color: var(--bg-color);
      transition: background-color 2s ease;
    }

    #lava-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      top: 0; left: 0;
      border-radius: 50%;
      filter: blur(6vw); 
      opacity: 0.8;
      will-change: transform; 
      transform-origin: center center;
    }

    .ui-layer {
      position: relative;
      z-index: 10;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: sans-serif;
      font-size: 2rem;
      pointer-events: none;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div id="lava-container"></div>
  
  <div class="ui-layer">
    <div id="status-text">Base State / Ожидание...</div>
  </div>

  <script>
    const container = document.getElementById('lava-container');
    
    const CONFIG = {
      minBlobs: 8,       // Строгий минимум
      maxBlobs: 14,      // Максимум
      baseColorHSL: { h: 358, s: 100, l: 68 }, 
      minLife: 10000,    // От 10 сек
      maxLife: 40000,    // До 40 сек
      anomalyChance: 0.03 // 3% шанс
    };

    let blobs = [];

    function easeInOutQuad(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    function hexToHSL(hex) {
      hex = hex.replace(/^#/, '');
      let r = parseInt(hex.substring(0, 2), 16) / 255;
      let g = parseInt(hex.substring(2, 4), 16) / 255;
      let b = parseInt(hex.substring(4, 6), 16) / 255;
      let max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;

      if (max === min) { h = s = 0; } 
      else {
        let d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    class Blob {
      constructor() {
        this.el = document.createElement('div');
        this.el.className = 'blob';
        
        this.isAnomaly = Math.random() < CONFIG.anomalyChance;
        this.size = 20 + Math.random() * 35;
        this.el.style.width = this.size + 'vw';
        this.el.style.height = this.size + 'vw';

        // Рандомная стартовая позиция
        this.x = Math.random() * 100;
        this.y = Math.random() * 100;

        // Полностью случайное направление от 0 до 360 градусов (в радианах)
        this.angle = Math.random() * Math.PI * 2;
        this.baseSpeed = 0.02 + Math.random() * 0.04; 
        this.timeOffset = Math.random() * 10000; 

        this.lifeTime = 0;
        
        if (this.isAnomaly) {
          // Аномалия: случайный цвет, 5-7 сек жизни, скорость 1.5x
          this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
          this.maxLife = 5000 + Math.random() * 2000; 
          this.baseSpeed *= 1.5; 
          this.el.style.zIndex = 5; 
        } else {
          // Обычная лава: цвет базы ±20% яркости, 10-40 сек жизни
          let lVariation = CONFIG.baseColorHSL.l + (Math.random() * 40 - 20);
          lVariation = Math.max(10, Math.min(90, lVariation)); 
          this.color = `hsl(${CONFIG.baseColorHSL.h}, ${CONFIG.baseColorHSL.s}%, ${lVariation}%)`;
          
          this.maxLife = CONFIG.minLife + Math.random() * (CONFIG.maxLife - CONFIG.minLife);
          this.el.style.zIndex = 1;
        }

        this.el.style.backgroundColor = this.color;

        let fadeVariance = 1 + (Math.random() * 0.3 - 0.15); 
        this.fadeDuration = Math.min(2500 * fadeVariance, this.maxLife * 0.3);

        container.appendChild(this.el);
      }

      update(dt, timestamp) {
        this.lifeTime += dt;

        // 1. Плавный Scale (0-1-0)
        let scale = 1;
        if (this.lifeTime < this.fadeDuration) {
          scale = easeInOutQuad(this.lifeTime / this.fadeDuration);
        } else if (this.lifeTime > this.maxLife - this.fadeDuration) {
          scale = Math.max(0, easeInOutQuad((this.maxLife - this.lifeTime) / this.fadeDuration));
        }

        if (this.lifeTime >= this.maxLife) return false;

        // 2. Движение XY: Нелинейная скорость (±20%)
        let speedMultiplier = 1 + 0.2 * Math.sin((timestamp + this.timeOffset) * 0.0015);
        let currentSpeed = this.baseSpeed * speedMultiplier;

        // Искажение траектории: заставляет их "извиваться", а не лететь прямо
        this.angle += 0.005 * Math.sin((timestamp + this.timeOffset) * 0.001);

        this.x += Math.cos(this.angle) * currentSpeed;
        this.y += Math.sin(this.angle) * currentSpeed;

        // Мягкое отталкивание от невидимых краев (за экраном), чтобы не улетали навсегда
        if (this.x < -20) { this.x = -20; this.angle = 0 + (Math.random() * 0.5 - 0.25); }
        if (this.x > 120) { this.x = 120; this.angle = Math.PI + (Math.random() * 0.5 - 0.25); }
        if (this.y < -20) { this.y = -20; this.angle = Math.PI / 2 + (Math.random() * 0.5 - 0.25); }
        if (this.y > 120) { this.y = 120; this.angle = -Math.PI / 2 + (Math.random() * 0.5 - 0.25); }

        // 3. Аппаратный рендер
        this.el.style.transform = `translate3d(calc(${this.x}vw - 50%), calc(${this.y}vh - 50%), 0) scale(${scale})`;

        return true; 
      }

      destroy() {
        if (this.el.parentNode) {
          this.el.parentNode.removeChild(this.el);
        }
      }
    }

    let lastTime = 0;

    function animate(timestamp) {
      if (!lastTime) lastTime = timestamp;
      let dt = timestamp - lastTime;
      lastTime = timestamp;

      // ЖЕСТКИЙ ЛИМИТ: Мгновенно добиваем до 8, если их меньше
      while (blobs.length < CONFIG.minBlobs) {
        blobs.push(new Blob());
      } 
      
      // Плавный спавн до 14
      if (blobs.length < CONFIG.maxBlobs && Math.random() < 0.01) {
        blobs.push(new Blob());
      }

      for (let i = blobs.length - 1; i >= 0; i--) {
        let isAlive = blobs[i].update(dt, timestamp);
        if (!isAlive) {
          blobs[i].destroy();
          blobs.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    function setLavaColor(hexColor) {
      CONFIG.baseColorHSL = hexToHSL(hexColor);
      let darkBg = `hsl(${CONFIG.baseColorHSL.h}, ${CONFIG.baseColorHSL.s}%, 10%)`;
      document.documentElement.style.setProperty('--bg-color', darkBg);
      document.getElementById('status-text').innerText = `Цвет: ${hexColor}`;
    }

    requestAnimationFrame(animate);

    // Демонстрация смены цвета каждые 20 сек
    setInterval(() => {
      let randomHex = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
      setLavaColor(randomHex);
    }, 20000);

  </script>
</body>
</html>
