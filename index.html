<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPoster - Map of Tasks</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-bg: #2b0a0a;
      --color-blob1: #ff5e62;
      --color-blob2: #ff9966;
      --color-blob3: #f12711;
      
      --glass-border: rgba(255, 255, 255, 0.2);
      --text-color: #ffffff;
      
      --card-open-bg: rgba(255, 255, 255, 0.15);
      --card-locked-bg: rgba(80, 80, 80, 0.4);
      --card-completed-bg: rgba(46, 204, 113, 0.85);
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
      color: var(--text-color);
      background-color: var(--color-bg);
    }

    .lava-background {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.8;
      animation: float 20s infinite alternate cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    .blob:nth-child(1) { width: 60vw; height: 60vw; background: var(--color-blob1); top: -10%; left: -10%; animation-duration: 25s; }
    .blob:nth-child(2) { width: 50vw; height: 50vw; background: var(--color-blob2); bottom: -20%; right: -10%; animation-duration: 22s; animation-delay: -5s; }
    .blob:nth-child(3) { width: 55vw; height: 55vw; background: var(--color-blob3); bottom: 20%; left: 20%; animation-duration: 28s; animation-delay: -10s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(10%, 20%) scale(1.2); }
      100% { transform: translate(-20%, 10%) scale(0.9); }
    }

    /* Исправлено: Текстура доски через Base64 (никаких спецсимволов) */
    .chalkboard-overlay {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 1;
      backdrop-filter: blur(20px) brightness(0.6);
      -webkit-backdrop-filter: blur(20px) brightness(0.6);
      background-image: url("data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgMjAwIDIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZmlsdGVyIGlkPSJub2lzZUZpbHRlciI+PGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9IjAuODUiIG51bU9jdGF2ZXM9IjMiIHN0aXRjaFRpbGVzPSJzdGl0Y2giLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjbm9pc2VGaWx0ZXIpIiBvcGFjaXR5PSIwLjE1Ii8+PC9zdmc+");
    }

    .wake-frame {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0px 0px rgba(0, 150, 255, 0);
      transition: box-shadow 0.3s ease;
      z-index: 9999;
    }
    body.wake-active .wake-frame { animation: pulseBlue 1.5s infinite; }
    @keyframes pulseBlue {
      0% { box-shadow: inset 0 0 30px 10px rgba(0, 150, 255, 0.6); }
      50% { box-shadow: inset 0 0 100px 40px rgba(0, 190, 255, 0.9); }
      100% { box-shadow: inset 0 0 30px 10px rgba(0, 150, 255, 0.6); }
    }

    .tasks-grid {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 1.5vw;
      width: 100vw;
      height: 100vh;
      padding: 3vw 5vw;
    }

    .card {
      position: relative;
      background: var(--card-open-bg);
      border: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1vw;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      animation: jellyWobble 8s ease-in-out infinite alternate;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.4s, filter 0.4s;
    }

    .card:nth-child(even) { animation-direction: alternate-reverse; animation-duration: 9s; }
    .card:nth-child(3n) { animation-duration: 11s; }

    @keyframes jellyWobble {
      0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
      33% { border-radius: 60% 40% 50% 50% / 50% 60% 40% 60%; }
      66% { border-radius: 50% 50% 30% 70% / 60% 40% 60% 40%; }
      100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
    }

    .pin {
      position: absolute;
      top: 6%;
      width: 1.2vw;
      height: 1.2vw;
      background: radial-gradient(circle at 30% 30%, #ff7675, #d63031);
      border-radius: 50%;
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.4), 3px 5px 8px rgba(0,0,0,0.5);
      z-index: 2;
    }

    .day-number {
      font-size: 2.5vw;
      line-height: 1;
      margin-top: 1vw;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
      z-index: 2;
    }

    .card-text {
      font-size: 0.7vw;
      font-family: sans-serif;
      font-weight: bold;
      opacity: 0.8;
      margin-top: 0.5vw;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      z-index: 2;
    }

    .card.locked { background: var(--card-locked-bg); filter: grayscale(0.8) brightness(0.7); }
    .card.locked .lock-icon { width: 2.5vw; height: 2.5vw; fill: rgba(255, 255, 255, 0.5); margin-top: 0.5vw; }
    
    .card.locked .skeleton-lines { width: 70%; display: flex; flex-direction: column; gap: 0.3vw; margin-top: 0.5vw; }
    .skeleton-line { height: 0.4vw; background: rgba(0, 0, 0, 0.4); border-radius: 2px; }
    .skeleton-line:nth-child(1) { width: 100%; }
    .skeleton-line:nth-child(2) { width: 80%; }
    .skeleton-line:nth-child(3) { width: 60%; }

    .card.completed {
      background: var(--card-completed-bg);
      border-color: rgba(46, 204, 113, 0.5);
      box-shadow: 0 0 30px rgba(46, 204, 113, 0.4);
    }
    .card.completed .day-number, .card.completed .card-text { display: none; }
    .card.completed .check-icon {
      width: 5vw; height: 5vw;
      fill: none; stroke: #ffffff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    .card.selected {
      transform: scale(1.35) translateY(-1vw);
      z-index: 100;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 40px rgba(255,255,255,0.4);
      animation: jellyFast 1.5s ease-in-out infinite alternate;
    }
    .card.selected.locked { background: rgba(100, 100, 100, 0.6); border-color: rgba(255,255,255,0.4); }
    .card.selected.completed { background: rgba(46, 204, 113, 1); box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 40px rgba(46, 204, 113, 0.8); }

    @keyframes jellyFast {
      0% { border-radius: 45% 55% 60% 40% / 45% 45% 55% 55%; }
      100% { border-radius: 55% 45% 40% 60% / 55% 55% 45% 45%; }
    }
  </style>
</head>
<body>

  <div class="lava-background">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
  </div>

  <div class="chalkboard-overlay"></div>
  <div class="wake-frame"></div>
  <div class="tasks-grid" id="tasks-grid"></div>

  <script>
    var totalDays = 30;
    var grid = document.getElementById('tasks-grid');
    var cards = [];
    var currentCursorIndex = 0;

    // Исправлено: Однострочные SVG для безопасности парсеров
    var lockSVG = '<svg class="lock-icon" viewBox="0 0 24 24"><path d="M12 17a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M8 10V7a4 4 0 118 0v3h1a2 2 0 012 2v8a2 2 0 01-2 2H7a2 2 0 01-2-2v-8a2 2 0 012-2h1zm2-3a2 2 0 114 0v3h-4V7z" clip-rule="evenodd"/></svg>';
    var checkSVG = '<svg class="check-icon" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" /></svg>';

    function initCards() {
      grid.innerHTML = '';
      cards = [];
      for (var i = 1; i <= totalDays; i++) {
        var card = document.createElement('div');
        card.className = 'card';
        card.id = 'day-' + i;
        // Исправлено: Классическая конкатенация строк
        card.innerHTML = '<div class="pin"></div><div class="day-number">' + i + '</div><div class="content-container"></div>';
        
        grid.appendChild(card);
        cards.push(card);
      }
    }

    function setDayState(day, state, text) {
      if (day < 1 || day > totalDays) return;
      var card = cards[day - 1];
      var container = card.querySelector('.content-container');
      
      card.classList.remove('locked', 'completed', 'open');
      card.classList.add(state);

      if (state === 'locked') {
        container.innerHTML = lockSVG + '<div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div>';
      } else if (state === 'completed') {
        container.innerHTML = checkSVG;
      } else if (state === 'open') {
        container.innerHTML = '<div class="card-text">' + (text || '') + '</div>';
      }
    }

    function setCursor(day) {
      if (day < 1 || day > totalDays) return;
      if (cards[currentCursorIndex]) {
        cards[currentCursorIndex].classList.remove('selected');
      }
      currentCursorIndex = day - 1;
      cards[currentCursorIndex].classList.add('selected');
    }

    function triggerWakeWord(durationMs) {
      var ms = durationMs || 3000;
      document.body.classList.add('wake-active');
      setTimeout(function() {
        document.body.classList.remove('wake-active');
      }, ms);
    }

    // Инициализация
    initCards();

    // --- ДЕМОНСТРАЦИОННЫЙ БЛОК ---
    for (var j = 1; j <= 12; j++) setDayState(j, 'completed');
    setDayState(13, 'open', 'Прочитать суру Аль-Кахф после Джума.');
    setDayState(14, 'open', 'Сделать садака, накормить нуждающегося.');
    setDayState(15, 'open', 'Позвонить родственникам, спросить о здоровье.');
    for (var k = 16; k <= 30; k++) setDayState(k, 'locked');
    
    setCursor(14);
  </script>
</body>
</html>
